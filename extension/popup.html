<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Half-Life</title>
    <style>
      :root {
        --void: #0a0c0e;
        --panel: #101417;
        --raised: #171c21;
        --line: #1e252b;
        --line-2: #2a333b;
        --ink: #e6edf3;
        --dim: #9fb0bd;
        --faint: #64778a;
        --phos: #4ade80;
        --silent: #f5b544;
        --breaking: #f2555a;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        width: 420px;
        max-height: 580px;
        margin: 0;
        overflow-y: auto;
        background: var(--void);
        color: var(--ink);
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--phos); flex: none; }
      h1 {
        margin: 0;
        font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .tag {
        margin-left: auto;
        padding: 3px 7px;
        border: 1px solid var(--line-2);
        border-radius: 3px;
        color: var(--dim);
        font: 500 10.5px/1 ui-monospace, monospace;
        letter-spacing: 0.1em;
      }
      main { padding: 14px 16px 18px; }
      button.primary {
        width: 100%;
        padding: 11px 14px;
        border: 0;
        border-radius: 7px;
        background: var(--phos);
        color: var(--void);
        font: 600 12px/1 ui-monospace, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button.primary:disabled { opacity: 0.45; cursor: default; }
      .status {
        margin-top: 12px;
        color: var(--faint);
        font: 11.5px/1.6 ui-monospace, monospace;
        white-space: pre-wrap;
      }
      .totals { display: flex; gap: 18px; margin-top: 14px; }
      .totals div { display: flex; flex-direction: column; gap: 3px; }
      .totals b { font: 600 20px/1 ui-monospace, monospace; }
      .totals span { color: var(--faint); font: 10.5px/1 ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; }
      .silent b { color: var(--silent); }
      .breaking b { color: var(--breaking); }
      ul { margin: 14px 0 0; padding: 0; list-style: none; }
      li {
        margin-bottom: 9px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-left: 2px solid var(--line-2);
        border-radius: 7px;
        background: var(--panel);
      }
      li.silent { border-left-color: var(--silent); }
      li.breaking { border-left-color: var(--breaking); }
      .chip {
        display: inline-block;
        margin-bottom: 6px;
        font: 600 10px/1 ui-monospace, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      li.silent .chip { color: var(--silent); }
      li.breaking .chip { color: var(--breaking); }
      .quote {
        margin: 0 0 7px;
        color: var(--ink);
        font: 11.5px/1.55 ui-monospace, monospace;
        word-break: break-word;
      }
      .why { margin: 0; color: var(--dim); font-size: 12px; }
      .fix { margin: 7px 0 0; color: var(--phos); font: 11.5px/1.5 ui-monospace, monospace; word-break: break-word; }
      .empty { margin-top: 14px; color: var(--dim); }
      .err { margin-top: 12px; color: var(--breaking); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot"></span>
      <h1>Half-Life</h1>
      <span class="tag">Tailwind v3 → v4</span>
    </header>
    <main>
      <button class="primary" id="run">Check this page</button>
      <div class="status" id="status">Reads the page you are on and checks it against what actually changed in v4.</div>
      <div id="totals"></div>
      <ul id="findings"></ul>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
