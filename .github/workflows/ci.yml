name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Guards the project's two invariants: stage 1 is byte-for-byte
      # reproducible and cannot reach an LLM. Needs no API key, because the
      # stage it checks does not make network calls - which is the point.
      - name: Verify stage 1 invariants
        run: npm run verify

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
