name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Guards the project's two invariants: stage 1 is byte-for-byte
      # reproducible and cannot reach an LLM. Needs no API key, because the
      # stage it checks does not make network calls - which is the point.
      - name: Verify stage 1 invariants
        run: npm run verify

      # Next generates route/layout types (LayoutProps and friends) that the
      # app's own source references. They do not exist in a fresh checkout, so
      # typechecking before this step fails on CI while passing locally.
      - name: Generate Next route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
